name: Release Publishing

on:
  workflow_call:
    inputs:
      runner:
        description: Runner type (e.g., ubuntu-latest)
        type: string
        required: false
        default: ubuntu-latest
      phase:
        description: The release phase (publishing or close-issues)
        type: string
        required: true
      dry-run:
        description: Run in dry-run mode
        type: boolean
        default: false
      sbom-config:
        description: SBOM metadata configuration (JSON) for NTIA-compliant SBOM generation
        type: string
        required: false
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_REVIEW_PAT:
        required: false
      CUSTOM_REGISTRIES:
        description: |
          Custom registry authentication (one per line).
          Format: https://registry.example.com/_authToken=TOKEN
        required: false
      NPM_TOKEN:
        description: |
          NPM access token for publishing to npmjs.org.
          Required for first-time publishes or when OIDC isn't configured.
        required: false

jobs:
  publish:
    name: Publish Packages
    runs-on: ${{ inputs.runner }}
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      TURBO_RUN_SUMMARY: "1"
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup runtime
        id: runtime
        uses: savvy-web/silk-runtime-action@v1
        with:
          turbo-s3-bucket: ${{ secrets.TURBO_S3_BUCKET }}
          turbo-s3-region: ${{ secrets.TURBO_S3_REGION }}
          turbo-s3-endpoint: ${{ secrets.TURBO_S3_ENDPOINT }}
          turbo-s3-access-key-id: ${{ secrets.TURBO_S3_ACCESS_KEY_ID }}
          turbo-s3-secret-access-key: ${{ secrets.TURBO_S3_SECRET_ACCESS_KEY }}
          ignore-scripts: true

      - name: Run release
        id: release
        uses: savvy-web/silk-release-action@v5
        with:
          phase: ${{ inputs.phase }}
          app-client-id: ${{ vars.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ inputs.dry-run }}
          custom-registries: ${{ secrets.CUSTOM_REGISTRIES }}
          release-branch: changeset-release/main
          npm-token: ${{ secrets.NPM_TOKEN }}
          sbom-config: ${{ inputs.sbom-config }}

      - name: Generate GitHub App token
        id: app-token
        # `released_packages` was never a real silk-release-action output (see
        # action.yml: token/installation-id/app-slug/result/phase/status/
        # succeeded/package-count/release-pr-number/closed-issues*) — the old
        # condition always evaluated false, so this step and everything gated
        # on it below never actually ran. Gate on the real phase/succeeded
        # outputs instead; v5 names the publishing phase `publish`.
        if: steps.release.outputs.phase == 'publish' && steps.release.outputs.succeeded == 'true' && !inputs.dry-run
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: savvy-web

      - name: Notify package release router
        if: steps.release.outputs.phase == 'publish' && steps.release.outputs.succeeded == 'true' && !inputs.dry-run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RESULT: ${{ steps.release.outputs.result }}
        run: |
          set -euo pipefail

          # Package names actually published this run, from the structured
          # `result` output. A workspace may publish several packages, under
          # more than one name, to more than one registry, so this flattens the
          # workspace map and dedupes. `outcome == "published"` means bytes were
          # uploaded — it deliberately excludes `recovered` (already on the
          # registry at an identical digest), which is a success but not a new
          # publication. See schemas/5.0.0/silk-release-action-5.0.0.json,
          # PublishOutput.publish.workspaces[].packages[].
          packages=$(echo "$RESULT" | jq -r '[.publish.workspaces[].packages[] | select(.outcome == "published") | .name] | unique | join(",")')

          if [ -z "$packages" ]; then
            echo "No packages published this run; skipping router notification."
            exit 0
          fi

          # The commit the release tags point at; every package tagged in this
          # monorepo release shares it, so downstream consumers can pin to it.
          release_sha=$(git rev-parse HEAD)

          echo "Notifying router of released packages: $packages ($release_sha)"

          gh api repos/savvy-web/.github-private/dispatches \
            -f event_type=packages-released \
            -f "client_payload[packages]=$packages" \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" \
            -f "client_payload[sha]=$release_sha"

      - name: Notify marketplace repo
        if: steps.release.outputs.phase == 'publish' && steps.release.outputs.succeeded == 'true' && !inputs.dry-run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RESULT: ${{ steps.release.outputs.result }}
        run: |
          set -euo pipefail

          # Route this repo's release to the Claude Code marketplace plugin(s)
          # (if any) it corresponds to in savvy-web/systems'
          # .claude-plugin/marketplace.json, and dispatch them all as one
          # `json` patch array (`{"plugins":[{name,sha},...]}`) rather than the
          # single-plugin manual path — a monorepo release can publish more
          # than one plugin in a single run, and each match below appends its
          # own patch to the same array.
          release_sha=$(git rev-parse HEAD)
          plugins_json="[]"

          add_plugin() {
            plugins_json=$(jq -c --arg name "$1" --arg sha "$release_sha" '. + [{name: $name, sha: $sha}]' <<<"$plugins_json")
          }

          case "$GITHUB_REPOSITORY" in
            savvy-web/systems)
              # Tracked by GitHub release rather than by package name: the
              # plugin tree lives in this repo and is repinned to the release
              # commit, so any completed release that actually created a
              # GitHub release this run repins it — no dependency on which
              # npm package happened to publish.
              if echo "$RESULT" | jq -e 'select(.success) | .totals.releasesCreated > 0' >/dev/null; then
                add_plugin "silk"
              fi
              ;;
          esac

          if [ "$plugins_json" = "[]" ]; then
            echo "No marketplace plugin mapped to this release; skipping repin dispatch."
            exit 0
          fi

          json_payload=$(jq -c --argjson plugins "$plugins_json" -n '{plugins: $plugins}')
          echo "Dispatching repin for: $(echo "$plugins_json" | jq -r '[.[].name] | join(", ")') at $release_sha"

          gh api repos/savvy-web/systems/dispatches \
            -f event_type=plugin-release \
            -f "client_payload[json]=$json_payload"
